<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategorien &amp; Wohnungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    /* Hazu-Standardschrift (Lato) auf das gesamte Widget anwenden */
    #ebCategories, #ebCategories * {
      font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="ebCategories"></div>
  <script type="text/javascript" src="https://www.easy-booking.at/ebPlugins/categories/jquery.easybooking.categories.v2.js"></script>
  <script type="text/javascript">
    function ebCategoriesLoadedCheck() {
      if (typeof jQuery != "undefined") {
        if (jQuery.fn.ebCategories) {
          jQuery("#ebCategories").ebCategories({
            customerId: 11803,
            serialNo: "2107-3738-2369",
            localeId: 2,
            loadCSS: true,
            maxImgWidth: 960,
            maxImgHeight: 960,
            bookingPage: "popup",
            enquiryPage: "popup",
            showAvailability: true,
            showPrices: true,
            showDetails: true,
            category: "all",
            roomLevel: false,
            room: "all",
            categoryDescription: true,
            roomSorting: "random"
          });
        } else {
          setTimeout(ebCategoriesLoadedCheck, 200);
        }
      } else {
        setTimeout(ebCategoriesLoadedCheck, 200);
      }
    }
    ebCategoriesLoadedCheck();

    // --- Dynamische Höhe an die übergeordnete Hazu-Seite melden ---
    function sendHeight() {
      var height = document.body.scrollHeight;
      window.parent.postMessage({ type: "sm-iframe-height", height: height }, "*");
    }

    window.addEventListener("load", function () {
      sendHeight();
      if (window.ResizeObserver) {
        // Reagiert auf jede Grössenänderung des Inhalts (z.B. Bilder laden nach)
        new ResizeObserver(sendHeight).observe(document.body);
      } else {
        // Fallback für ältere Browser: mehrfach senden, da Inhalt asynchron nachlädt
        var i = 0;
        var interval = setInterval(function () {
          sendHeight();
          i++;
          if (i > 20) clearInterval(interval);
        }, 500);
      }
    });
    window.addEventListener("resize", sendHeight);
  </script>
</body>
</html>
